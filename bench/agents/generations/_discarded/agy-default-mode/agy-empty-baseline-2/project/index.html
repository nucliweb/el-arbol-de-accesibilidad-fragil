<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ajustes — Tono de llamada</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#contenido-principal">Saltar al contenido principal</a>

  <div class="page">
    <header class="page-header">
      <p class="eyebrow">Ajustes del dispositivo</p>
      <h1>Sonido y llamadas</h1>
      <p class="subtitle">Personaliza el tono que sonará cuando recibas una llamada entrante.</p>
    </header>

    <main id="contenido-principal">
      <section class="settings-card" aria-labelledby="titulo-tono">
        <div class="card-header">
          <div>
            <h2 id="titulo-tono">Tono de llamada</h2>
            <p class="current-selection">
              Tono activo: <strong id="tono-activo">Calisto</strong>
            </p>
          </div>
        </div>

        <form id="form-ajustes" novalidate>
          <fieldset class="ringtone-fieldset">
            <legend class="sr-only">Selecciona un tono de llamada</legend>

            <ul class="ringtone-list" role="list">
              <li class="ringtone-item">
                <div class="ringtone-choice">
                  <input
                    class="ringtone-radio"
                    type="radio"
                    id="tono-calisto"
                    name="ringtone"
                    value="Calisto"
                    checked
                  >
                  <label class="ringtone-label" for="tono-calisto">
                    <span class="ringtone-name">Calisto</span>
                    <span class="ringtone-desc">Acorde cálido y pausado</span>
                  </label>
                </div>
                <button
                  type="button"
                  class="preview-button"
                  data-tone="Calisto"
                  aria-label="Escuchar tono Calisto"
                >
                  <svg class="icon-play" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
                    <path fill="currentColor" d="M8 5.14v13.72a1 1 0 0 0 1.53.85l10.86-6.86a1 1 0 0 0 0-1.7L9.53 4.29A1 1 0 0 0 8 5.14Z"/>
                  </svg>
                  <svg class="icon-stop" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
                    <rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/>
                  </svg>
                  <span class="preview-label">Probar</span>
                </button>
              </li>

              <li class="ringtone-item">
                <div class="ringtone-choice">
                  <input
                    class="ringtone-radio"
                    type="radio"
                    id="tono-ganimedes"
                    name="ringtone"
                    value="Ganímedes"
                  >
                  <label class="ringtone-label" for="tono-ganimedes">
                    <span class="ringtone-name">Ganímedes</span>
                    <span class="ringtone-desc">Melodía armónica ascendente</span>
                  </label>
                </div>
                <button
                  type="button"
                  class="preview-button"
                  data-tone="Ganímedes"
                  aria-label="Escuchar tono Ganímedes"
                >
                  <svg class="icon-play" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
                    <path fill="currentColor" d="M8 5.14v13.72a1 1 0 0 0 1.53.85l10.86-6.86a1 1 0 0 0 0-1.7L9.53 4.29A1 1 0 0 0 8 5.14Z"/>
                  </svg>
                  <svg class="icon-stop" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
                    <rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/>
                  </svg>
                  <span class="preview-label">Probar</span>
                </button>
              </li>

              <li class="ringtone-item">
                <div class="ringtone-choice">
                  <input
                    class="ringtone-radio"
                    type="radio"
                    id="tono-luna"
                    name="ringtone"
                    value="Luna"
                  >
                  <label class="ringtone-label" for="tono-luna">
                    <span class="ringtone-name">Luna</span>
                    <span class="ringtone-desc">Campana suave y cristalina</span>
                  </label>
                </div>
                <button
                  type="button"
                  class="preview-button"
                  data-tone="Luna"
                  aria-label="Escuchar tono Luna"
                >
                  <svg class="icon-play" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
                    <path fill="currentColor" d="M8 5.14v13.72a1 1 0 0 0 1.53.85l10.86-6.86a1 1 0 0 0 0-1.7L9.53 4.29A1 1 0 0 0 8 5.14Z"/>
                  </svg>
                  <svg class="icon-stop" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
                    <rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/>
                  </svg>
                  <span class="preview-label">Probar</span>
                </button>
              </li>

              <li class="ringtone-item">
                <div class="ringtone-choice">
                  <input
                    class="ringtone-radio"
                    type="radio"
                    id="tono-europa"
                    name="ringtone"
                    value="Europa"
                  >
                  <label class="ringtone-label" for="tono-europa">
                    <span class="ringtone-name">Europa</span>
                    <span class="ringtone-desc">Pulso rítmico y brillante</span>
                  </label>
                </div>
                <button
                  type="button"
                  class="preview-button"
                  data-tone="Europa"
                  aria-label="Escuchar tono Europa"
                >
                  <svg class="icon-play" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
                    <path fill="currentColor" d="M8 5.14v13.72a1 1 0 0 0 1.53.85l10.86-6.86a1 1 0 0 0 0-1.7L9.53 4.29A1 1 0 0 0 8 5.14Z"/>
                  </svg>
                  <svg class="icon-stop" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
                    <rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/>
                  </svg>
                  <span class="preview-label">Probar</span>
                </button>
              </li>
            </ul>
          </fieldset>

          <div class="actions">
            <button type="submit" class="btn btn-primary" id="btn-guardar">Guardar cambios</button>
            <button type="button" class="btn btn-secondary" id="btn-restablecer">Restablecer</button>
          </div>

          <p class="status-message" id="estado-ajustes" role="status" aria-live="polite" aria-atomic="true"></p>
        </form>
      </section>
    </main>
  </div>
</body>
</html>
