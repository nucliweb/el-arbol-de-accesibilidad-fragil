<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Tono de llamada | Ajustes</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="page-shell">
    <header class="page-header">
      <p class="eyebrow">Sonido y notificaciones</p>
      <h1>Ajustes</h1>
      <p class="page-intro">Elige el tono que sonará al recibir llamadas entrantes.</p>
    </header>

    <main>
      <section class="settings-card">
        <div class="section-header">
          <h2 id="ringtone-heading">Llamadas</h2>
          <p class="current-summary">
            Tono activo: <strong id="current-ringtone">Calisto</strong>
          </p>
        </div>

        <form id="settings-form" action="#settings-form" method="post" aria-labelledby="ringtone-heading">
          <fieldset class="ringtone-fieldset" aria-describedby="ringtone-hint">
            <legend>Tono de llamada</legend>
            <p id="ringtone-hint" class="field-hint">
              Selecciona una opción y pulsa «Guardar cambios». Puedes usar «Probar» para escuchar una muestra.
            </p>

            <div class="ringtone-group">
              <div class="ringtone-option">
                <div class="ringtone-choice">
                  <input
                    type="radio"
                    id="ringtone-calisto"
                    name="ringtone"
                    value="calisto"
                    class="ringtone-radio"
                    checked
                  >
                  <label for="ringtone-calisto" class="ringtone-label">Calisto</label>
                </div>
                <button
                  type="button"
                  class="preview-btn"
                  data-ringtone="calisto"
                  aria-pressed="false"
                >
                  <svg class="preview-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                    <path d="M8 5v14l11-7z" fill="currentColor"></path>
                  </svg>
                  <span class="preview-btn__text">Probar</span>
                  <span class="visually-hidden">tono Calisto</span>
                </button>
              </div>

              <div class="ringtone-option">
                <div class="ringtone-choice">
                  <input
                    type="radio"
                    id="ringtone-ganimedes"
                    name="ringtone"
                    value="ganimedes"
                    class="ringtone-radio"
                  >
                  <label for="ringtone-ganimedes" class="ringtone-label">Ganímedes</label>
                </div>
                <button
                  type="button"
                  class="preview-btn"
                  data-ringtone="ganimedes"
                  aria-pressed="false"
                >
                  <svg class="preview-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                    <path d="M8 5v14l11-7z" fill="currentColor"></path>
                  </svg>
                  <span class="preview-btn__text">Probar</span>
                  <span class="visually-hidden">tono Ganímedes</span>
                </button>
              </div>

              <div class="ringtone-option">
                <div class="ringtone-choice">
                  <input
                    type="radio"
                    id="ringtone-luna"
                    name="ringtone"
                    value="luna"
                    class="ringtone-radio"
                  >
                  <label for="ringtone-luna" class="ringtone-label">Luna</label>
                </div>
                <button
                  type="button"
                  class="preview-btn"
                  data-ringtone="luna"
                  aria-pressed="false"
                >
                  <svg class="preview-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                    <path d="M8 5v14l11-7z" fill="currentColor"></path>
                  </svg>
                  <span class="preview-btn__text">Probar</span>
                  <span class="visually-hidden">tono Luna</span>
                </button>
              </div>

              <div class="ringtone-option">
                <div class="ringtone-choice">
                  <input
                    type="radio"
                    id="ringtone-europa"
                    name="ringtone"
                    value="europa"
                    class="ringtone-radio"
                  >
                  <label for="ringtone-europa" class="ringtone-label">Europa</label>
                </div>
                <button
                  type="button"
                  class="preview-btn"
                  data-ringtone="europa"
                  aria-pressed="false"
                >
                  <svg class="preview-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                    <path d="M8 5v14l11-7z" fill="currentColor"></path>
                  </svg>
                  <span class="preview-btn__text">Probar</span>
                  <span class="visually-hidden">tono Europa</span>
                </button>
              </div>
            </div>
          </fieldset>

          <div class="form-actions">
            <button type="submit" class="primary-btn">Guardar cambios</button>
          </div>

          <div class="status-region" role="status" aria-live="polite" aria-atomic="true">
            <div id="status-message" class="status-banner" hidden>
              <svg class="status-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                <path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z" fill="currentColor"></path>
              </svg>
              <span id="status-text"></span>
            </div>
          </div>
        </form>
      </section>
    </main>

    <footer class="page-footer">
      <p>Las preferencias se guardan localmente en este navegador.</p>
    </footer>
  </div>
</body>
</html>
