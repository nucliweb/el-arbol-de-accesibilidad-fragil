# Publishes the talk to GitHub Pages: the slides (deck/) at the root and the
# browser version of the benchmark (bench/web) at /benchmark/.
name: Publish the slides and the browser benchmark

on:
  push:
    branches: [main]
    paths:
      - 'deck/**'
      - 'bench/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install the benchmark tools
        working-directory: bench
        run: npm ci
      - name: Build every app (setup also checks Chrome, preinstalled on the runner)
        working-directory: bench
        run: npm run setup
      - name: Build the browser benchmark
        working-directory: bench
        run: npm run web:build
      - name: Assemble the site (slides at the root, benchmark at /benchmark/)
        run: |
          mkdir -p site/benchmark
          cp -R deck/index.html deck/deck.css deck/deck.js deck/assets site/
          cp -R bench/web/dist/. site/benchmark/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
