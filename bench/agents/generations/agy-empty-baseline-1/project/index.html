<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ajustes — Tono de llamada</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <header class="page-header">
      <p class="eyebrow">Ajustes del dispositivo</p>
      <h1>Sonido y llamadas</h1>
      <p class="subtitle">Personaliza el tono que sonará cuando recibas una llamada entrante.</p>
    </header>

    <main class="settings-card">
      <div class="current-summary">
        <span class="summary-label">Tono seleccionado</span>
        <strong id="selected-tone-name" class="summary-value">Calisto</strong>
      </div>

      <form id="ringtone-form" class="ringtone-form">
        <fieldset class="tone-fieldset">
          <legend class="tone-legend">Tono de llamada</legend>

          <ul class="tone-list">
            <li class="tone-item">
              <div class="tone-option">
                <input
                  type="radio"
                  id="tone-calisto"
                  name="ringtone"
                  value="Calisto"
                  class="tone-radio"
                  checked
                >
                <label for="tone-calisto" class="tone-label">
                  <span class="tone-name">Calisto</span>
                  <span class="tone-desc">Arpegio cristalino y pausado</span>
                </label>
              </div>
              <button
                type="button"
                class="preview-btn"
                data-tone="Calisto"
                aria-label="Escuchar vista previa de Calisto"
                aria-pressed="false"
              >
                <svg class="icon icon-play" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
                  <path d="M8 5.5v13l10.5-6.5L8 5.5z" fill="currentColor"></path>
                </svg>
                <svg class="icon icon-stop" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
                  <rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"></rect>
                </svg>
                <span class="preview-btn-text">Escuchar</span>
              </button>
            </li>

            <li class="tone-item">
              <div class="tone-option">
                <input
                  type="radio"
                  id="tone-ganimedes"
                  name="ringtone"
                  value="Ganímedes"
                  class="tone-radio"
                >
                <label for="tone-ganimedes" class="tone-label">
                  <span class="tone-name">Ganímedes</span>
                  <span class="tone-desc">Pulso cálido con resonancia profunda</span>
                </label>
              </div>
              <button
                type="button"
                class="preview-btn"
                data-tone="Ganímedes"
                aria-label="Escuchar vista previa de Ganímedes"
                aria-pressed="false"
              >
                <svg class="icon icon-play" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
                  <path d="M8 5.5v13l10.5-6.5L8 5.5z" fill="currentColor"></path>
                </svg>
                <svg class="icon icon-stop" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
                  <rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"></rect>
                </svg>
                <span class="preview-btn-text">Escuchar</span>
              </button>
            </li>

            <li class="tone-item">
              <div class="tone-option">
                <input
                  type="radio"
                  id="tone-luna"
                  name="ringtone"
                  value="Luna"
                  class="tone-radio"
                >
                <label for="tone-luna" class="tone-label">
                  <span class="tone-name">Luna</span>
                  <span class="tone-desc">Notas suaves de tono nocturno</span>
                </label>
              </div>
              <button
                type="button"
                class="preview-btn"
                data-tone="Luna"
                aria-label="Escuchar vista previa de Luna"
                aria-pressed="false"
              >
                <svg class="icon icon-play" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
                  <path d="M8 5.5v13l10.5-6.5L8 5.5z" fill="currentColor"></path>
                </svg>
                <svg class="icon icon-stop" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
                  <rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"></rect>
                </svg>
                <span class="preview-btn-text">Escuchar</span>
              </button>
            </li>

            <li class="tone-item">
              <div class="tone-option">
                <input
                  type="radio"
                  id="tone-europa"
                  name="ringtone"
                  value="Europa"
                  class="tone-radio"
                >
                <label for="tone-europa" class="tone-label">
                  <span class="tone-name">Europa</span>
                  <span class="tone-desc">Destellos armónicos y brillantes</span>
                </label>
              </div>
              <button
                type="button"
                class="preview-btn"
                data-tone="Europa"
                aria-label="Escuchar vista previa de Europa"
                aria-pressed="false"
              >
                <svg class="icon icon-play" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
                  <path d="M8 5.5v13l10.5-6.5L8 5.5z" fill="currentColor"></path>
                </svg>
                <svg class="icon icon-stop" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
                  <rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"></rect>
                </svg>
                <span class="preview-btn-text">Escuchar</span>
              </button>
            </li>
          </ul>
        </fieldset>

        <div class="form-footer">
          <p id="status-message" class="status-message" role="status" aria-live="polite"></p>
          <button type="submit" class="save-btn">Guardar ajustes</button>
        </div>
      </form>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
